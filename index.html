    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Teuku Aditya",
        "jobTitle": "Business Analyst",
        "email": "mailto:teukuaditya2003@gmail.com",
        "telephone": "+62 878-8362-3555",

    <!-- Theme init: runs before first paint to avoid flash of wrong theme.
         Priority: saved choice > prefers-color-scheme > dark (site default). -->
    <script>
      (() => {
        const saved = localStorage.getItem("theme");
        const dark = saved
          ? saved === "dark"
          : !window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>

  <body>
    <a class="skip-link" href="#main" data-i18n="a11y.skip">Skip to content</a>

    <div id="scroll-progress" aria-hidden="true"></div>
    <div id="cursor-glow" aria-hidden="true"></div>

    <header id="header" class="sticky top-0 z-50"></header>
    <main id="main"></main>
    <footer id="footer"></footer>

    <!-- Project / document case-study modals (rendered by JS) -->
    <dialog id="modal" class="card m-auto max-w-3xl max-h-[85vh] w-[calc(100%-2rem)] p-0 text-fg backdrop:bg-black/60"></dialog>

    <!-- Command palette (Ctrl/Cmd + K) -->
    <dialog id="palette" class="card m-auto mt-[12vh] max-w-xl w-[calc(100%-2rem)] p-0 text-fg"></dialog>

    <!-- Toast feedback -->
    <div id="toasts" class="fixed bottom-5 left-1/2 z-[95] flex -translate-x-1/2 flex-col items-center gap-2" role="status" aria-live="polite"></div>

    <!-- Back to top -->
    <button
      id="back-to-top"
      class="fixed bottom-5 right-5 z-[85] hidden h-10 w-10 items-center justify-center rounded-full border border-line bg-elevated text-muted shadow-lg transition-all hover:border-accent-400 hover:text-accent-400 dark:hover:text-accent-300"
      aria-label="Back to top"

        </p>

    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
